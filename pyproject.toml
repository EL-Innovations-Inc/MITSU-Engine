[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsu-engine"
version = "0.4.0"
description = "A neural-network and language-model engine built around the MITSU activation: numpy with convolutions and automatic differentiation, and a PyTorch twin for GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evan David Little" }]
dependencies = ["numpy>=1.24"]
keywords = ["neural-network", "activation-function", "numpy", "pytorch", "deep-learning", "transformer", "language-model", "tokenizer", "convolution", "automatic-differentiation", "gpu"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.scripts]
mitsu-engine = "mitsu_engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
torch = ["torch>=2.3"]

[tool.setuptools]
packages = ["mitsu_engine", "mitsu_engine.twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
