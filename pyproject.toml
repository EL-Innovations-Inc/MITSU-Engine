[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsu-engine"
version = "0.1.0"
description = "A numpy-only neural-network engine built around the MITSU activation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evan David Little" }]
dependencies = ["numpy>=1.24"]
keywords = ["neural-network", "activation-function", "numpy", "deep-learning", "transformer"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["mitsu_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
