[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsu-engine"
version = "0.2.0"
description = "A numpy-only neural-network and language-model engine built around the MITSU activation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evan David Little" }]
dependencies = ["numpy>=1.24"]
keywords = ["neural-network", "activation-function", "numpy", "deep-learning", "transformer", "language-model", "tokenizer"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.scripts]
mitsu-engine = "mitsu_engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["mitsu_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
