name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  numpy:
    name: numpy only (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
      - name: Tests (the PyTorch twin's tests are skipped)
        run: pytest -q
      - name: Spirals example
        run: python examples/01_spirals.py
      - name: Automatic differentiation example
        run: python examples/07_autodiff.py
      - name: Command line is importable
        run: python -m mitsu_engine --help
  twin:
    name: PyTorch twin (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Tests
        run: pytest -q
      - name: Device check (on the CPU)
        run: python -m mitsu_engine gpu-check --device cpu --no-speed
      - name: Twin example
        run: python examples/05_torch_twin.py
